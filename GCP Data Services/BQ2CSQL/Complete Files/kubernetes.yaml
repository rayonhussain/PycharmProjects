apiVersion: apps/v1
kind: Deployment
metadata:
  name: bq-to-csql-loader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bq-loader
  template:
    metadata:
      labels:
        app: bq-loader
      annotations:
        iam.gke.io/gcp-service-account: your-sa@your-project.iam.gserviceaccount.com
    spec:
      containers:
      - name: loader
        image: gcr.io/your-project/bq-to-csql:v1
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-secrets
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  BQ_PROJECT_ID: "your-project"
  BQ_DATASET_ID: "staging"
  BQ_TABLE_ID: "source_table"
  CLOUD_SQL_HOST: "127.0.0.1"
  CLOUD_SQL_PORT: "3306"
  CLOUD_SQL_DATABASE: "mydb"
  CLOUD_SQL_TABLE_NAME: "target_table"
  BATCH_SIZE: "5000"
  USE_WORKLOAD_IDENTITY: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
type: Opaque
data:
  CLOUD_SQL_PASSWORD: bXlwYXNzd29yZA==  # base64 encoded
